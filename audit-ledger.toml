note = """
The real one of the four accepted: it does emit task definitions from an
arbitrary project's manifest into additionalContext, truncated at MAX_DEF=60.

Labelling it was considered and rejected. The label would cost always-loaded
words in every session of every project, against a vector whose source is a
manifest the user cloned on purpose and whose payload is capped at 60
characters. Recorded so a later audit does not re-litigate it -- if the cap
is ever raised or the source widened, the sha changes and this returns.
"""

