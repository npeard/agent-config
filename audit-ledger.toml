asset_sha = "62e9c5e6c721a60bd40a3cf22d389d0484d4a8abd739291dd044a581729ccce6"
note = """
The trust boundary exists and is documented at the point of use: AppleScript
string literals are escaped for backslash and quote before reaching osascript,
and PowerShell single quotes are escaped by doubling. The flagged conjunction
is real -- text does reach a shell interpreter -- and it is already handled.
"""

