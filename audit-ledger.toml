cause = "working-as-designed"
outcome = "tier-0"
asset_sha = "e17f10081fa5142c37060d100d2d6de4f9dc7f8bed245c8d061e734e9754032a"
note = """
Matches on manifest presence to decide whether to fire, then emits its own
fixed message. Nothing it read reaches context.
"""

[[decision]]
asset = "hooks/audit-owed.py"
principle = 5
date = "2026-08-21"
cause = "working-as-designed"
outcome = "tier-0"
asset_sha = "dff5be0c1222b2947cc894aab8f12f1a2417bc8fcc833120f6daf75b7886fa84"
note = """
Found by code review, not by the check: the P5 classifier had no source
pattern for subprocess output, so this branch's own hook -- which puts `git
diff-tree` paths into additionalContext -- was the read-and-emit shape the
check exists to enumerate and self-exempted from it. The classifier now treats
subprocess as a source, counting only against a high-severity sink (agent
context or a shell argument), so a script that shells out and prints to a
terminal does not become a candidate.

Accepted rather than removed, because the mitigation is in place: each path is
emitted as a JSON string literal, the same framing rule friction.py's excerpt
uses, so a crafted filename cannot terminate its own quoting. The paths are
also this repo's own git history rather than a foreign source, and are capped
at four.

Re-granted 2026-08-21 after review restored the cwd guard and dropped the
staged-changes proxy; the hash expired as designed. The framing is unchanged.
"""
