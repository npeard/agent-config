Re-granted after the BENIGN_EXIT/HARD_FAILURE fix, which changed how errors
are classified but not what is emitted or how it is framed.

Not deleted, because printing an example is what makes a friction class
actionable. The finding was about framing, not about the feature.

Re-granted after adding encoding="utf-8" to two read_text calls
(cross-platform default-encoding fix). Neither call is on the excerpt path;
the framing this entry rests on is unchanged.

Re-verified 2026-09-04 for the two classes added to the CLASSES table
(`command-timeout`, `path-not-found`). That table is matched against error
text and yields only names this repo authored; the excerpt path this entry
actually rests on -- `review_bundle`'s single `json.dumps` of a
400-character transcript slice -- is untouched. Which is the pattern of
