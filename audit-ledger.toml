which rejects names outside the conda and PyPI charsets. The solver excerpt is
ASCII-filtered pixi text, which may quote the manifest. `render` collapses
whitespace in every detail line, so manifest-authored text in a spec or the
excerpt cannot open a line of its own; a newline in a name did exactly that in
task-list.py, and a test pins the fix here. Nothing read is executed or passed
to a shell: the live runner takes an argv list. The `--ack` hint names the
running interpreter, this script and the project root (the session's own cwd),
each quoted and whitespace-collapsed. The rest of the emitted text is this
file's own wording plus a pixi environment name (lowercase letters, digits and
dashes), a time.strftime date, an int() pid, and the CacheView label "(as of
DATE; refresh started)" or "(... refresh in progress)".
"""

