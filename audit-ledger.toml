paragraph's reasoning and not just a re-stamp: `banner_argv` previously
reached PowerShell only through `sound_argv`'s bare-name lookup, which never
carried `title` or `message`. It now also builds a `powershell -Command`
balloon script that interpolates both through the same new `powershell_literal`
helper -- single-quote doubling, the identical rule `sound_argv` already used.
So this is host text reaching a second interpreter, not merely the
pre-existing path exercised again; it is accepted because the escaping
discipline is the correct one for that interpreter, verified by inspection of
`powershell_literal` and consistent with the existing PowerShell rule below.
The `TERMINAL_NOTIFIER` branch passes `title`/`message` as literal argv
elements to a real executable, never through a shell, so it carries no
interpreter risk at all.

`session_id` to a filename. It is sanitized to alphanumerics plus `-_` and
capped at 64 characters, which leaves no path separator and no `..`, so the
marker cannot be steered out of its directory; the cap also keeps a hostile
id from turning a name-too-long error into the failure path.

The marker directory is the part worth stating precisely, because two
plausible-looking constructions do not hold it. `gettempdir()` is per-user on
macOS but the shared, sticky /tmp on Linux, and the marker is written on every
platform -- not only where a named sound resolves -- so markers live in a
subdirectory named for the current uid. `mkdir` applies `mode=` only when it
creates, so a pre-existing directory keeps whatever mode it has, and
`exist_ok=True` is satisfied by a symlink because it tests `is_dir()`; neither
establishes a private directory. What the code enforces instead: the mkdir is
exclusive, an existing directory is checked with `lstat` for being a real
directory owned by this uid with no group or other bits, and arming declines
when that fails. Arming is `O_CREAT|O_EXCL|O_WRONLY` rather than `touch()`,
atomic against a racing second yield and refusing to follow a planted symlink.
The nudge write is `O_WRONLY|O_NOFOLLOW` with no `O_CREAT`, so it can neither
follow a planted link nor recreate a marker that a drain removed.

Re-granted after fixing sound_argv()'s path/bare-name classification: it now
tests the sound-name string's own shape (separator or drive-letter prefix)
instead of the live host's os.sep, and the Windows-table existence check uses
