note = """
check_script_help's own rationale is "a script an agent must read to use has
failed principle 3 while pretending to serve it" -- but this file is never
invoked. It is a library module imported by install.py, register_hooks.py,
preflight.py and audit_assets.py to keep one set of platform decisions
(interpreter layout, what counts as a link, junction vs symlink) from being
duplicated and drifting across them; hooks deliberately do not import it,
since they run standalone and stay stdlib-only.

Bolting on an ArgumentParser that no one runs would satisfy the check without
serving the principle behind it: there is no CLI interface for --help to
document, and a decorative parser would be read as an entry point that does
not exist. The check has no way to distinguish an importable module from an
entry-point script, so this is the false positive rather than a gap to close
by writing to the check.
"""
