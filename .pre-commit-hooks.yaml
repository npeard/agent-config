# Consumers pin a rev; per-project behaviour goes through `args:` in their
# own config, never through edits here.
- id: check-ascii
  name: ASCII-only source (no Unicode; use plain text or LaTeX)
  entry: check-ascii
  language: python
  types_or: [python, markdown]

- id: plain-math
  name: Plain-text math stand-ins in plot labels and Typst/LaTeX
  entry: plain-math --gate
  language: python
  files: \.(py|tex|typ)$

- id: trivial-wrappers
  name: Trivial wrapper functions
  entry: trivial-wrappers --gate
  language: python
  types: [python]

- id: forward-refs
  name: Forward references in Typst and LaTeX documents
  entry: forward-refs --containing
  language: python
  files: \.(tex|typ)$

- id: report-check
  name: Report figure registry agrees with the document and scripts
  entry: report-check
  language: python
  # One process sees every file, so a report split across batches is not
  # checked, and its findings printed, once per batch.
  require_serial: true
  files: (^|/)(Snakefile|[^/]*\.typ|plot_[^/]*\.py)$
