per project.

"""

[[decision]]
class = "hook-modified-files"
date = "2026-09-04"
cause = "working-as-designed"
outcome = "tier-0"
count_at_decision = 11
note = """
Committing before running the formatter, so pre-commit stashes unstaged work,
a hook rewrites a staged file, and the commit exits 1. The rule already exists
-- coding standard 7, never hand-fix what a tool owns, run the project's own
format command -- and tier 1 was considered and rejected: the only precise
predictor of "a hook will rewrite a staged file" is running the formatter, so
the hook would have to run `pixi run format` inside every `git commit`,
mutating files from a pre-tool hook on every commit. That is a large,
always-on cost against a failure that self-describes and costs one `git add`.
Evidence the rule works when followed: the branch that produced this entry ran
`pixi run format` before all eight commits and hit this zero times.

Re-decided 2026-09-04 at 11, and the cause is downgraded from
rule-not-enforced to working-as-designed. Reading the eleven: three are
`nbstripout`, three `ruff-format`, three `mdformat`, one
`trailing-whitespace`, one `end-of-file-fixer`. Every one is an *auto-fixer*
reporting that it fixed something. Failing the commit after rewriting a
staged file is how an auto-fixer asks to be re-staged; there is no version of
that which is not one extra `git add` and one extra `git commit`. Calling it
a rule that was not enforced overstated it -- the rule prevents the subset
this repo's own `pixi run format` covers, and pre-commit is deliberately the
net under the rest.

The growth is also mostly not this repo's. All three `nbstripout` occurrences
are in a notebook project whose own format task does not strip notebooks,
which is a project-local tooling gap belonging in that project's CLAUDE.md,
not here. The prior entry's evidence held again: the branch that wrote this
ran `pixi run all` before every commit and hit this zero times.
"""

[[decision]]
class = "user-rejected-tool"
date = "2026-09-03"
cause = "underspecified-task"
outcome = "tier-0"
count_at_decision = 9
note = """
Re-decided after the count more than doubled (4 -> 9, 5 sessions), all in one
project (a physics-research repo, `doqs`). Read all nine rather than
re-stamping the prior note, because the shape underneath had shifted.

Seven of nine are AskUserQuestion calls rejected with "user wants to
clarify"; two are bare "STOP what you are doing" with no elaboration. Unlike
the 2026-08-24 batch, the questions themselves are not malformed -- checked
two directly against their transcript: each is a single well-scoped decision
(how to spend the next N hours of compute, given a specific measurement just
obtained), with three mutually exclusive, non-overlapping options and no
unstated premise. The rejection is not "this question is broken," it is "the
menu does not contain the answer" -- the user has context (new data, a
different tradeoff they want to make) that a fixed set of options drafted
before that context existed cannot anticipate. This is the same cause as the
prior decision wearing a different symptom: rework from a decision point
where the model is asked to pre-enumerate options for a call that depends on
information only the user has, not tooling failing to catch something.

Still tier-0. A hook can count AskUserQuestion calls or even flag a rejection,
but cannot judge in advance whether a menu will cover the real answer --
that judgment requires the domain context the tool call was trying to
resolve in the first place, which is exactly what cause 6 excludes from a
mechanical fix. Tier 4 considered and rejected again: "ask good questions"
is already ambient, and the failure here is not question quality but
timing -- asking for a menu-shaped decision immediately after a result lands,
before the user has had a chance to react to the result itself. That is a
per-situation judgment call, not a rule that compresses to one restatable
line.

If this reopens again, look specifically at whether long-running compute
scoping (the recurring trigger in this batch: "how should I scope the next
N-hour sweep") should default to a plain question with no options rather than
AskUserQuestion, since six of the seven here were exactly that shape.

Evidence the corrected behaviour works: later in the same session, questions
that were preceded by the measurement they depended on (the eval-only ceiling
before the L target choice, the target_trajectory cost before the budget)
were answered directly on the first ask.
"""

[[decision]]
class = "unrecognized-arg"
date = "2026-09-04"
cause = "working-as-designed"
outcome = "tier-0"
count_at_decision = 7
note = """
Not friction, and the class name misdescribes it. Every occurrence is zsh's
`nomatch` refusing a glob that matched no files -- `rm -f dir/payload-*.json`
when no payload had been written yet -- not an unrecognized argument to
anything. Recorded under the classifier's name rather than a truer one so the
key still matches what `friction.py` emits; the label is the imprecision, the
diagnosis is here.

The refusal is worth more than what it costs. bash would pass the unmatched
pattern through unchanged, so `for f in dir/payload-*.json` would iterate once
over a filename that does not exist and the body would act on it -- which is
the failure zsh converts into an immediate, located error. Cost is one round
trip, and the guard is `2>/dev/null || true` or an existence test at the point
of use.

Tier 1 was considered and rejected: a PreToolUse hook would have to decide
which globs in a command string are allowed to match nothing, which is not
decidable from the string, so it would fire on correct commands. Tier 4 was
rejected because a line spent in AGENTS.md is read by every future session
forever, and this buys back one round trip per three weeks.

Re-affirmed 2026-09-04 at 7, same cause, and the doubling did bring one thing
the entry above did not cover. Five of the seven are the glob-matched-nothing
shape already described. The other two are `no matches found: --include=*.py`
-- an argument meant for `grep` to expand, which zsh ate first because it was
unquoted. That is the opposite error: not a glob that should have matched,
but a pattern that should never have reached the shell. Its fix is quoting
the argument, and it is worth naming separately because "guard the glob with
`2>/dev/null || true`" is the wrong advice for it.

`unsetopt nomatch` was considered this time and rejected. It would make both
shapes disappear by giving zsh bash's pass-through behaviour, but it is a
change to the user's own interactive shell as well as the agent's, and the
first paragraph above is the argument against it on the merits: the refusal
catches a class of silent wrong-file action that pass-through converts into
a no-op nobody sees.
"""

[[decision]]
class = "assertion-failed"
date = "2026-09-04"
cause = "working-as-designed"
outcome = "tier-0"
count_at_decision = 8
note = """
Two benign things share this class, and reading the example rather than the
name is what separates them.

Most occurrences are an inline heredoc script's own guard: the shape is
`File "<stdin>", line 9, in <module> AssertionError`, from an
`assert src.count(old) == 1` written before a string replacement so the edit
cannot silently no-op or apply twice. When it fires it has prevented a bad
edit and cost one round trip, which is the definition of cause 4. Removing
the guard to remove the friction would trade a real guarantee for a smaller
error count -- the same trade codespell-finding already rejected.

The rest are tests failing during test-driven development, where red before
green is the method working. A class that counts those as friction is
counting the process.

The recurring *trigger* for the guard version is worth naming even though it
changes nothing: edit a file, run `pixi run format`, then try to match text
the formatter has since rewrapped. Reading the current text first is the fix,
and the failure already says exactly that at the point of use, with the
mismatched anchor quoted. A hook cannot help -- it has no way to know what
string a future replacement intends to match -- and tier 4 was rejected
because AGENTS.md is at 1249 of 1250 words and the guidance would restate
what the traceback already reports.

Checked against write-before-read, which shares that trigger and was also
decided tier-0. They are distinct, and the boundary is one sentence:
write-before-read is the harness refusing an edit to a file that changed on
disk, this is an inline script's own guard refusing a replacement whose
anchor text no longer matches. Kept separate on that basis.

If this reaches 16, look at whether the guard is firing on *formatter*
rewrapping specifically, and whether editing before formatting rather than
after would remove the class without removing the guard.
"""

[[decision]]
class = "command-timeout"
date = "2026-09-04"
cause = "rule-not-enforced"
outcome = "tier-0"
count_at_decision = 14
note = """
New class, added the same day it was decided: it was 14 of the 31 errors
sitting in `unclassified`, the largest single shape there, and `HARD_FAILURE`
had already refused to file "timed out" as benign -- so the intent to count
it predated the regex by weeks. That is what the unclassified rate is for.

The 14 split three ways, counted rather than estimated: 6 are polling loops
at the default 2m budget (they print `poll 1`, `poll 2`, ...), 6 are bare 2m
timeouts with no distinguishing output, and 2 are long compute runs that had
already been given a 10m budget and outran it.

The last two are not friction at all -- a training run exceeding a budget
someone chose is the budget working, and the `timeout` parameter exists for
exactly that. The 6 polling loops are, and they are the same root behaviour
as `sleep-blocked` rather than a new one: choosing to poll for work the
harness already reports instead of yielding the turn. That entry asked, at 8,
that if it reached 16 someone check "whether polling is being chosen over
yielding". It is still at 8, but this class is that check arriving from the
other side, and the answer is yes -- 6 more instances, none of which used
`sleep`, so `sleep-blocked` could never have seen them.

Still tier-0, and for the reason that entry gave: the alternatives are worse.
A hook cannot recognise a poll loop from a command string without also
refusing correct commands, and the harness already re-invokes a session when
harness-tracked work finishes, so there is no rule to add that is not already
true at the point of use. What this decision buys is the measurement: the two
entries now cross-reference, and if the polling share of this class grows the
evidence will be in one place instead of split across two symptoms.

Kept as a separate class from `sleep-blocked` on a statable boundary:
sleep-blocked is the harness refusing a `sleep`, this is a command exceeding
its budget, of which polling is one cause among three.
"""

[[decision]]
class = "path-not-found"
date = "2026-09-04"
cause = "working-as-designed"
outcome = "tier-0"
count_at_decision = 9
note = """
New class, from the same unclassified sweep as `command-timeout`: 9 errors
where a command was handed a path that is not there, 8 of which were
unclassified before (the ninth is a `FileNotFoundError` traceback already
counted under `python-traceback`). Deliberately not
merged into `file-not-found`, which matches the Read tool's own "File does
not exist" -- the boundary is one sentence, the harness refusing a path it
was asked to read versus a shell command failing on one, and the fixes
differ, so counting them together would hide which is which.

Counted, since this note claims to be: 3 are `cd: no such file or directory`
on a relative path, 4 are `sed` or `ugrep` on a filename that was guessed
rather than listed, and 2 are neither -- a Ghostscript initialisation
failure and the traceback noted above. So the shape below describes 7 of the
9 and not all of them. The recurring shape is a relative path resolved
against a working
directory the command was not actually in -- which is a real hazard here,
because the Bash tool's cwd persists between calls and is not always where
the last `cd` left it.

Tier 0. The shell names the exact missing path, the cost is one round trip,
and the guidance that prevents it -- prefer absolute paths -- is already in
the Bash tool description, which is the point of use. Tier 1 was considered
and rejected: a PreToolUse hook checking whether path-shaped arguments exist
would have to know which arguments are paths and which paths are about to be
created, and it would fire on every `mkdir`, `touch` and redirect. Tier 4 was
rejected because AGENTS.md is at its word ceiling and would be restating a
tool description.
"""

[[decision]]
class = "destructive-figure-pipeline"
date = "2026-09-09"
cause = "rule-not-enforced"
outcome = "tier-4-already-taken"
count_at_decision = 4
note = """
Four incidents in one branch, all in the doqs dispersion-engineering figure
pipeline: orphaned python children deleting a committed .h5 after the shell
was killed; torch.cuda.empty_cache() not freeing the live allocations that
actually fill the card; a driver defaulting to --fresh and wiping modes that
had already succeeded; and an over-broad process guard blocking legitimate
concurrent work.

One root cause, not four: those scripts unlink their output before writing
and hold GPU memory across a whole sweep, so any imprecision in driving them
destroys committed data or exhausts the device. That property is what makes
ordinary mistakes expensive here.

The generalizable half was already taken to tier 4 mid-branch (AGENTS.md,
"Stopping a background job does not stop what it spawned"), so this entry
records the decision rather than proposing a second artifact. The
project-specific half is in the doqs memory
(doqs-figure-run-orphan-processes, doqs-windows-box-gpu-fp64).

Tier 1 was considered and rejected. A PreToolUse hook on Bash could look for
backgrounded `python -m examples...` invocations, but it cannot know which
scripts truncate their output, so it would either miss the general case or
fire on every backgrounded command. Tier 2 was rejected for the same reason a
generic guard failed inside this branch: the useful check is "is a writer for
THIS output already alive", which only the driver knows. Those drivers now
carry it (scratch/p4*.sh: refuse a live peer, trap INT/TERM, --fresh opt-in),
and they are correctly gitignored session scaffolding rather than assets.

The honest reading is that the fix belongs to the doqs scripts themselves --
they should write to a temp path and rename, so an interrupted run cannot
destroy the previous one. That is project work, not agent-config work, and it
is recorded in the doqs memory for whoever next touches them.
"""

[[decision]]
class = "reimplemented-existing-convention"
date = "2026-09-09"
cause = "underspecified-task"
outcome = "tier-0"
count_at_decision = 1
note = """
Published five wrong numbers in a paper: the MG/DM tracking mean-absolute
errors. The consumer (plot_dm_nnn.py) interpolates the target onto the
engineered time grid column by column; the script written to compute the
quoted values decimated it instead (b[::step]). With 10x target substeps
those sample different points, so every digit was wrong while the ordering
that carried the argument happened to survive. A reviewer caught it by
recomputing from the same trajectories.

Cause 6, not a tooling gap. No linter or hook detects "you computed a
published quantity by a different convention than the figure does". The spec
said "recomputed from the stored magnetizations" and never said *by whose
definition*, which is precisely a decision the spec stage failed to make.

Tier 0, with the lesson recorded where it applies rather than as a new asset:
when a number will be published next to a figure, compute it with the
figure's own code path, not a reimplementation. The writing-orchestration
skill already carries the axis that catches this (claim integrity: "every
claim traces to a citation, a figure, a derivation, or the author's own
result") -- it was the reviewer applying that axis that found it. The skill
worked; the spec was the weak link, and a first occurrence does not justify
a fifth artifact.
"""
