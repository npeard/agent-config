[[decision]]
class = "write-before-read"
date = "2026-08-20"
cause = "working-as-designed"
outcome = "tier-0"
count_at_decision = 4
note = """
Not disobedience. The trigger is running `pixi run format`, which rewrites
files that were already read, so the harness's staleness check fires on the
next edit. The check is what stops a stale write from clobbering a formatter
change, and it reports at the moment it matters for the cost of one round
trip. Removing or muting it would trade a real guarantee for that round trip.
"""

