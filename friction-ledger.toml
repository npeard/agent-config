# Decisions about recurring friction found by `pixi run friction`.
#
# This file is what makes the loop converge instead of nag: a class with a
# decision here is not re-proposed. It reappears only if its count has
# doubled since the decision, on the grounds that a rejected finding which
# got much worse is new evidence rather than the same finding.
#
# `count_at_decision` is required for that rule to work -- a decision
# without it suppresses the class forever, which is how a loop like this
# goes quietly blind.
#
# `cause` names *why* the friction recurred, from the taxonomy in the reflect
# skill; `outcome` names what was done about it, following the tier ladder in
# the same place. Both are required. Recording only the outcome loses the
# diagnosis, and it is the causes that reveal patterns -- five frictions all
# tracing to `underspecified-task` is a finding that outcomes alone hide.
#
# `tier-0` means no artifact was created, which is the expected outcome most
# of the time.
#
# `source` names how the friction was found, and selects which of the rules
# above apply. It defaults to `transcript` when absent, so every entry written
# before the field existed keeps its original meaning.
#
#   transcript -- mined by `pixi run friction`. The class must be one the
#     classifier emits, and `count_at_decision` is required, because the
#     doubling rule above is what reopens it.
#
#   observed -- found by doing the work: a warning read, a build gotcha hit.
#     The reflect skill takes friction from the branch just finished, not only
#     from mined sessions, and that friction has no class name in CLASSES and
#     no counter to double. So `count_at_decision` is *omitted* rather than
#     invented: writing 1 there would state a count nothing measured, and
#     reopening at 2 would be arithmetic on a number that means nothing.
#     Such an entry records a decision; it suppresses nothing, and
#     `read_ledger` deliberately does not return it.
#
# The distinction is enforced in tests rather than by convention, because both
# variants look like a healthy entry and the failure -- a typo'd transcript
# class that silently suppresses nothing -- is invisible.

