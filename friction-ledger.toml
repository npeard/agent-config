# Decisions about recurring friction found by `pixi run friction`.
#
# This file is what makes the loop converge instead of nag: a class with a
# decision here is not re-proposed. It reappears only if its count has
# doubled since the decision, on the grounds that a rejected finding which
# got much worse is new evidence rather than the same finding.
#
# `count_at_decision` is required for that rule to work -- a decision
# without it suppresses the class forever, which is how a loop like this
# goes quietly blind.
#
# `cause` names *why* the friction recurred, from the taxonomy in the reflect
# skill; `outcome` names what was done about it, following the tier ladder in
# the same place. Both are required. Recording only the outcome loses the
# diagnosis, and it is the causes that reveal patterns -- five frictions all
# tracing to `underspecified-task` is a finding that outcomes alone hide.
#
# `tier-0` means no artifact was created, which is the expected outcome most
# of the time.

[[decision]]
class = "codespell-finding"
date = "2026-08-19"
cause = "working-as-designed"
outcome = "tier-0"
count_at_decision = 4
note = """
Not friction. A pre-commit hook catching a typo before it lands is the
system succeeding, and the cost is one round trip. Suppressing the typo
check to avoid the round trip would trade a real guarantee for a small
convenience.
"""

[[decision]]
class = "sleep-blocked"
date = "2026-08-21"
cause = "harness-constraint"
outcome = "tier-0"
count_at_decision = 8
note = """
Re-decided after the count doubled from 4 to 8 (7 sessions). Same cause, and
the doubling did not change it: the harness refuses at the point of use and
names both alternatives in the refusal, so the rule is already as enforced as
a rule can be and the cost is one round trip.

What the doubling did buy is a sharper diagnosis. The recurring shape is not
"reached for sleep" but "polled for work the harness already reports". In the
occurrence that produced this entry the blocked `sleep` was waiting on a
background task, and the replacement -- a pgrep loop -- was worse: it could not
observe an in-process subagent and exited immediately, which reads as "done".
Both times the correct move was to yield the turn, because harness-tracked work
re-invokes you when it finishes.

Tier 1 was considered and rejected. A PreToolUse hook could only refuse what
the harness already refuses, with a worse message, which the redundancy check
calls duplication rather than defence in depth. Tier 4 was rejected too: the
guidance exists in the Bash and ScheduleWakeup tool descriptions, AGENTS.md has
36 words of headroom, and restating a rule that is already mechanically
enforced is the thing the reflect skill's own red-flag table forbids.

If this reaches 16, the thing to examine is not sleep but whether polling is
being chosen over yielding, and whether anything can make yielding the obvious
move rather than the remembered one.
"""

