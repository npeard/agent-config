[[decision]]
class = "cmd-not-found"
date = "2026-09-04"
cause = "working-as-designed"
outcome = "tier-0"
count_at_decision = 8
note = """
Genuine cause-1 friction, but not this repo's. Every occurrence is a PDF
extraction binary (`pdftotext`, `mutool`) that claude-config has no use for;
the tool belongs in whichever project reads PDFs, added to that project's own
environment. Recording it here so it is not re-proposed against this repo,
where installing poppler would be dependency weight nothing uses.

Re-decided 2026-09-04 after the count doubled to 8, and the cause changed
with it -- the paragraph above is no longer true of the class it describes.
"Every occurrence is a PDF extraction binary" held at 4; at 8 the shape is:
`python` three times, `jq` twice, and one each of `brew`, `gh`, `pdftotext`.
Worth stating plainly because a ledger note is read as current: this one was
accurate when written and decayed silently, which is the same failure the
audit-ledger hit on hooks/audit-owed.py.

The missing-tooling half has largely resolved itself without a decision: `gh`
is now installed, and the `jq` occurrences came from `promotion-check.sh`,
which no longer exists -- it was rewritten as `promotion-check.py` and needs
no `jq`. Only `pdftotext`/`mutool` remain absent, and the original reasoning
still covers them.

What actually recurs now is `command not found: python`, including once in
the session that wrote this. It is not missing tooling: this machine
deliberately has no bare `python`, only the project-local pixi
interpreters, and reaching for `python` is habit rather than a gap. Cause 4:
the shell names the missing command instantly and the fix is one round trip
to `pixi run` or the env's interpreter. Tier 1 was considered -- extending
the SessionStart task-list hook to name the environment's python -- and
rejected: it would add always-injected context to every session in every
