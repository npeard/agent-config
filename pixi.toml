[workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.13"

[feature.dev.dependencies]
ruff = "*"
codespell = "*"
pre-commit = "*"
mdformat = "*"
mdformat-gfm = "*"
mdformat-frontmatter = "*"
pytest = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
ascii = "python scripts/check_ascii.py"
preflight = "python scripts/preflight.py"
friction = "python scripts/friction.py"
burn = "python scripts/burn.py"
toolgaps = "python scripts/toolgaps.py"
skills = "python scripts/validate_skills.py"
suppressions = "python scripts/suppressions.py"
thresholds = "python scripts/thresholds.py --strict"
register-hooks = "python scripts/register_hooks.py"
audit = "python scripts/audit_assets.py"
capture-codex = "python scripts/capture_codex_exec.py"

[feature.dev.tasks]
format = "ruff format . && ruff check --fix . && mdformat $(git ls-files --cached --others --exclude-standard '*.md' ':!:skills/quantikz/*')"
lint = "ruff check ."
spell = "codespell ."
precommit = "pre-commit run --all-files"
test = "pytest -q"
all = { depends-on = ["format", "lint", "ascii", "spell", "skills", "suppressions", "thresholds", "audit", "test"] }
