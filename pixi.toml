[workspace]
name = "agent-config"
description = "Shared agent guidance, skills and hooks for Claude Code and Codex"
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[dependencies]
# <3.15: ukkonen (pre-commit -> identify) has no cp315 conda-forge build yet,
# so the solver falls back to identify 1.x, which cannot read ruff's hooks.
python = ">=3.15.2,<3.16"
grimp = ">=3.18,<4"

[feature.dev.dependencies]
ruff = ">=0.17.3,<0.18"
codespell = ">=2.4.3,<3"
pre-commit = ">=4.7.0,<5"
mdformat = ">=1.0.0,<2"
mdformat-gfm = ">=1.0.0,<2"
mdformat-frontmatter = ">=2.2.0,<3"
pytest = ">=9.2.0,<10"
# The build backend, so test_exported installs this repo offline.
setuptools = ">=84.2.1,<85"

# What a scaffolded report builds with, so tests/test_new_report.py can build
# one end to end. This repo goes in editable because the generated build calls
# report-check and imports report_plotting as an installed consumer would.
[feature.report.dependencies]
typst = ">=0.15.1,<0.16"
matplotlib-base = ">=3.11.2,<4"
numpy = ">=2.5.4,<3"

[feature.report.pypi-dependencies]
snakemake = ">=9.15.0, <10"
agent-config = { path = ".", editable = true }

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"] }
# Apart from dev, so the hooks and a fresh clone's first commit do not install
# the report toolchain; CI tests here so the end-to-end builds still run.
report = { features = ["dev", "report"], solve-group = "default" }

[tasks]
ascii = "python scripts/check_ascii.py"
prose-metrics = "python scripts/prose_metrics.py"
surface-area = "python scripts/surface_area.py"
trivial-wrappers = "python scripts/trivial_wrappers.py"
plain-math = "python scripts/plain_math.py"
forward-refs = "python scripts/check_forward_refs.py"
preflight = "python scripts/preflight.py"
friction = "python scripts/friction.py"
burn = "python scripts/burn.py"
toolgaps = "python scripts/toolgaps.py"
skills = "python scripts/validate_skills.py"
suppressions = "python scripts/suppressions.py"
thresholds = "python scripts/thresholds.py --strict"
register-hooks = "python scripts/register_hooks.py"
audit = "python scripts/audit_assets.py"
nightly = "python scripts/nightly.py"
capture-codex = "python scripts/capture_codex_exec.py"

[feature.dev.tasks]
# default-environment because the report env includes dev, which otherwise
# makes every task here ambiguous to a bare `pixi run <task>`.
format = { cmd = "ruff format . && ruff check --fix . && mdformat $(git ls-files --cached --others --exclude-standard '*.md' ':!:skills/quantikz/*')", default-environment = "dev" }
lint = { cmd = "ruff check .", default-environment = "dev" }
spell = { cmd = "codespell .", default-environment = "dev" }
precommit = { cmd = "pre-commit run --all-files", default-environment = "dev" }
test = { cmd = "pytest -q", default-environment = "dev" }
# A no-op cmd, because pixi accepts default-environment only on a task that has one.
all = { cmd = "exit 0", depends-on = ["format", "lint", "ascii", "spell", "skills", "suppressions", "thresholds", "audit", "test"], default-environment = "dev" }
