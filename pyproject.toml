[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-config"
version = "0.1.0"
description = "Gates and tools exported from agent-config for pinned use in other projects"
# The floor is tomllib's (dep_updates, preflight's checks), the newest stdlib
# module the exported scripts need. CI tests 3.13 and up only, so 3.11 and
# 3.12 are allowed but untested.
requires-python = ">=3.11"

[project.scripts]
check-ascii = "check_ascii:main"
plain-math = "plain_math:main"
trivial-wrappers = "trivial_wrappers:main"
forward-refs = "check_forward_refs:main"
preflight = "preflight:main"
new-report = "new_report:main"
report-check = "report_check:main"
jupyter-mcp = "jupyter_mcp:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
# tests/test_exported.py fails on a sibling an export loads that is missing
# here, which preflight would otherwise skip silently once installed.
py-modules = [
    "check_ascii",
    "plain_math",
    "trivial_wrappers",
    "check_forward_refs",
    "preflight",
    "platform_paths",
    "installation_contract",
    "dep_updates",
    "vscode_extensions",
    "new_report",
    "report_plotting",
    "report_check",
    "jupyter_mcp",
]
