name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # dev too: the install and hook-registration tests check hooks name
          # the dev env's interpreter, which the installer always creates.
          environments: dev report
      - run: pixi run -e report test
