# .pre-commit-config.yaml
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    # friction-ledger.toml and audit-ledger.toml are hand-edited, and a
    # malformed one otherwise fails only at the next `pixi run friction`.
    -   id: check-toml
    -   id: check-added-large-files
        args: ['--maxkb=5000']
    -   id: debug-statements
    -   id: check-merge-conflict

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
    -   id: ruff-format

-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    -   id: codespell

-   repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
    -   id: mdformat
        # Both plugins are required, not cosmetic, and this hook runs in its
        # own isolated env -- so they must be repeated here even though
        # pixi.toml already has them, or the hook corrupts what the task
        # leaves alone. gfm: without it GFM tables parse as paragraphs and
        # the configured wrap destroys them. frontmatter: without it a
        # skill's `---` YAML block parses as a thematic break and is
        # rewritten, silently breaking the skill's registry entry.
        additional_dependencies: [mdformat-gfm, mdformat-frontmatter]
        # Excluded here rather than via .mdformat.toml's `exclude`, which
        # needs Python 3.13+ and would hard-fail this hook under 3.12.
        # LaTeX reference material: mdformat escapes bare backslashes in
        # prose, turning `\gate` into `\\gate`.
        exclude: ^skills/quantikz/

-   repo: local
    hooks:
    # Routed through `pixi run` rather than the dev-env binary's path
    # directly: that path forks at the env root on Windows (python.exe)
    # vs. bin/ everywhere else -- the same split platform_paths.py exists
    # to centralize -- and pre-commit's `entry` is a static string with no
    # per-OS branch. `pixi` itself is a stable PATH entry from its own
    # installer, unlike an *activated* Pixi shell, which is what this still
    # does not require. Requires `pixi install -e dev`.
    -   id: suppressions
        name: Every linter suppression must say why
        entry: pixi run --manifest-path pixi.toml -e dev python scripts/suppressions.py
        language: system
        types: [file]
        # An explicit pattern rather than `types: [python]`. The checker also
        # watches the linter's own config, which is the widest suppression
        # channel there is -- a project-wide `ignore = [...]` silences a rule
        # everywhere -- and with only Python passed in, that channel never ran
        # at commit time, so an unreasoned blanket ignore committed cleanly.
        # Spelled as a regex because `cfg` is not a pre-commit type tag and the
        # set here must stay in step with CONFIG_FILENAMES in the script.
        files: '(\.py|/pyproject\.toml|/ruff\.toml|/\.ruff\.toml|/setup\.cfg|/tox\.ini|/\.flake8|/mypy\.ini|/\.mypy\.ini)$|^(pyproject\.toml|ruff\.toml|\.ruff\.toml|setup\.cfg|tox\.ini|\.flake8|mypy\.ini|\.mypy\.ini)$'
    -   id: ascii-only
        name: ASCII-only source (no Unicode; use plain text or LaTeX)
        entry: pixi run --manifest-path pixi.toml -e dev python scripts/check_ascii.py
        language: system
        types_or: [python, markdown]

-   repo: meta
    hooks:
    -   id: check-hooks-apply
    -   id: check-useless-excludes
